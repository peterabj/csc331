<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 8px;
      background-color: #f5f5f5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    form label {
      display: block;
      margin-top: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #3e4a61;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2f374c;
    }

    .error {
      color: red;
      font-size: 0.9em;
      margin-top: 5px;
    }

    .success-message {
      background-color: #dff0d8;
      color: #3c763d;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    footer {
      height: 80px;
      background: #3e4a61;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .footer-content {
      text-align: center;
    }

    .footer-links {
      margin-top: 10px;
    }

    .footer-links a {
      color: white;
      margin: 0 10px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="Useklogo.png" alt="Logo" width="60" height="60">
    </div>
    <nav class="nav">
      <ul>
        <li><a href="index.html" >Home</a></li>
        <li><a href="CVcsc331.html">CV</a></li>
        <li><a href="sched.html">Schedule</a></li>
        <li><a href="Sudoku.html">Sudoku Quiz</a></li>
        <li><a href="contactUs.html"  id="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h1>Contact Us</h1>
    
    <div id="successMessage" class="success-message">
      Thank you! Your message has been sent successfully.
    </div>
    
    <form id="contactForm" action="contactusaction.php" method="POST" onsubmit="return validateForm()">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required minlength="3">
      <div id="nameError" class="error"></div>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <div id="emailError" class="error"></div>
      
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required minlength="10"></textarea>
      <div id="messageError" class="error"></div>
      
      <button type="submit">Send Message</button>
    </form>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Peter Asaad Abou Jawdeh. All rights reserved.</p>
      <div class="footer-links">
        <a href="mailto:peterabj28@gmail.com"><i class="fa-solid fa-envelope"></i></a> 
        <a href="https://github.com/yourusername" target="_blank"><i class="fab fa-github"></i></a> 
        <a href="https://linkedin.com/in/yourusername" target="_blank"><i class="fab fa-linkedin"></i></a>
      </div>
    </div>
  </footer>

  <script>
    function validateForm() {
      let valid = true;

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const successMessage = document.getElementById('successMessage');

      document.getElementById('nameError').textContent = '';
      document.getElementById('emailError').textContent = '';
      document.getElementById('messageError').textContent = '';
      successMessage.style.display = 'none';

      if (name.length < 3) {
        document.getElementById('nameError').textContent = 'Name must be at least 3 characters.';
        valid = false;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email.';
        valid = false;
      }

      if (message.length < 10) {
        document.getElementById('messageError').textContent = 'Message must be at least 10 characters.';
        valid = false;
      }

      if (!valid) {
        return false; // Prevent form submission
      }
      
      // If you want to handle the form submission via JavaScript instead of direct submission:
      // return false;
      
      // For normal form submission to the PHP script:
      return true;
    }
  </script>
</body>
</html>
